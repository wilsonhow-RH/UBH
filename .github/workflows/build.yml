name: Build Python Executables

# This tells GitHub to run the workflow when you push to the main branch
on:
  push:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    # This matrix tells GitHub to run this job three times, once on each OS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1. Check out the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python (you can change the version to match what you use)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      # 3. Install your dependencies and PyInstaller
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # 4. Build the executable using PyInstaller
      # REPLACE 'main.py' with the actual name of your script!
      - name: Build with PyInstaller
        run: pyinstaller --onefile --name my_app_${{ runner.os }} main.py

      # 5. Upload the compiled executable so you can download it
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ runner.os }}
          path: dist/*
          # Optional: How long GitHub keeps the files (default is 90 days)
          retention-days: 5
