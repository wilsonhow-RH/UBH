name: Build Python Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# This tells GitHub Actions to use the updated Node.js 24 engine, silencing the warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # REMEMBER TO REPLACE 'main.py' with your actual script name
      - name: Build with PyInstaller
        run: pyinstaller --onefile --name my_app_${{ runner.os }} app_Doping.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ runner.os }}
          path: dist/*
          retention-days: 5
